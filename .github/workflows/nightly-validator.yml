name: Nightly Validator

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Pillow
        run: python -m pip install --upgrade pip Pillow

      - name: Run repository validation
        run: python -m unittest discover -s tests

      - name: Run MagnaTux preflight
        run: ./test_magnatux.sh